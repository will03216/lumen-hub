services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumenhub
      POSTGRES_USER: lumenhub
      POSTGRES_PASSWORD: lumenhub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/pg-schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumenhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_CDN_BASE: ${NEXT_PUBLIC_CDN_BASE:-}
        # Build arg, not runtime env — see the note in the Dockerfile.
        NEXT_PUBLIC_VIDEO_EDIT: ${NEXT_PUBLIC_VIDEO_EDIT:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://lumenhub:lumenhub@postgres:5432/lumenhub
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /onboarding
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
      NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL: /sign-in
      # Also at runtime, not only as a build arg. The value is inlined into the
      # bundles at build time, so this is belt-and-braces — but without it the
      # server process reports the flag as unset, which is a confusing thing to
      # find when debugging why a page 404s.
      NEXT_PUBLIC_VIDEO_EDIT: ${NEXT_PUBLIC_VIDEO_EDIT:-}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET}
      BYTEPLUS_API_KEY: ${BYTEPLUS_API_KEY:-}
      MODELARK_AK: ${MODELARK_AK:-}
      MODELARK_SK: ${MODELARK_SK:-}
      MODELARK_TOS_BUCKET: ${MODELARK_TOS_BUCKET:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_GROUP_ID: ${MINIMAX_GROUP_ID:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
    volumes:
      # Mirrored CDN assets live on the container filesystem, so a rebuild
      # threw them away and the Library filled with broken thumbnails again —
      # the exact thing the mirror route exists to prevent. Keep them in a
      # named volume so they outlive the container.
      - library_cache:/app/public/library-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  library_cache:
