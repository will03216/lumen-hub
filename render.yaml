# Render Blueprint — Lumen Hub
# https://render.com/docs/blueprint-specifications
#
# Deploy: push this file to your repo, then on Render dashboard →
#         New → Blueprint → connect your GitHub repo. Render reads this file
#         and creates both the web service and Postgres for you.
#
# Required env vars to set on Render (under the web service → Environment):
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  — Clerk publishable key (pk_live_…)
#   CLERK_SECRET_KEY                   — Clerk secret key (sk_live_…)
#   KEY_ENCRYPTION_SECRET              — openssl rand -hex 32
#
# These are build-time args (NEXT_PUBLIC_*) and runtime vars, set via
# Render's Environment tab. The DATABASE_URL is wired automatically below.

databases:
  - name: lumen-hub-db
    plan: free
    databaseName: lumenhub
    # Render's free Postgres expires after 30 days. For production use
    # the "Starter" plan ($7/mo) which is permanent.
    # After creation, the internal connection string is available as
    # the env var `<DB_NAME>_INTERNAL_URL` on linked web services.

services:
  - type: web
    name: lumen-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    # Build args — NEXT_PUBLIC_* values are baked into the client bundle
    # at build time, so they must be available during the Docker build.
    dockerBuildArgs:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_CDN_BASE: ${NEXT_PUBLIC_CDN_BASE}
    environment:
      # Runtime vars (not baked into the build)
      NODE_ENV: production
      DATABASE_URL: ${lumen-hub-db.INTERNAL_DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /onboarding
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
      NEXT_PUBLIC_CLERK_AFTER_SIGN_OUT_URL: /sign-in
