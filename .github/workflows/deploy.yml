name: Build & Push to BytePlus CR

# Builds the amd64 image on GitHub's native x86 runners (no QEMU emulation) and
# pushes it to BytePlus Container Registry. Deploy on the ECS box afterwards with
#   cd /opt/lumen-hub && ./onbox-update.sh
#
# Required repo secrets (Settings → Secrets and variables → Actions → Secrets):
#   CR_REGISTRY   e.g. lumen-ap-southeast-3.cr.bytepluses.com
#   CR_USER       e.g. mittul.madaan@78638713
#   CR_PASSWORD   the CR access password
# Required repo variables (Settings → Secrets and variables → Actions → Variables):
#   CR_IMAGE      e.g. lumen-ap-southeast-3.cr.bytepluses.com/lumen/lumen-hub
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY   pk_test_... / pk_live_...
#   NEXT_PUBLIC_APP_URL                 https://lumen-hub.byteplus-demo.com
#   NEXT_PUBLIC_CDN_BASE                (optional, blank ok)

on:
  push:
    branches: [deploy]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to BytePlus CR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CR_REGISTRY }}
          username: ${{ secrets.CR_USER }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.CR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CDN_BASE=${{ vars.NEXT_PUBLIC_CDN_BASE }}

      - name: Summary
        run: |
          echo "### Pushed to CR :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deploy on ECS:  \`cd /opt/lumen-hub && ./onbox-update.sh\`" >> $GITHUB_STEP_SUMMARY
